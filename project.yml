name: Napkin
options:
  bundleIdPrefix: com.krisnorthfield
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_HARDENED_RUNTIME: YES
    # Apple Silicon only. Support: the current macOS and the one before it (now 27 and 26).
    ARCHS: arm64
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Napkin:
    type: application
    platform: macOS
    sources:
      - Napkin
    info:
      path: Napkin/Info.plist
      properties:
        CFBundleDisplayName: Napkin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
  NapkinTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - NapkinTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Napkin
schemes:
  Napkin:
    build:
      targets:
        Napkin: all
    test:
      targets:
        - NapkinTests
